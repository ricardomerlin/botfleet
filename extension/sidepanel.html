<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BotFleet</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <header class="top">
    <img src="icons/icon32.png" width="24" height="24" alt="" />
    <b>BotFleet</b>
    <span id="conn" class="conn" title="Server status"></span>
    <span class="spacer"></span>
    <button class="icon-btn" id="btn-dashboard" title="Open dashboard" aria-label="Open dashboard">
      <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3zm0 8h8v-6H3zm10 0h8V11h-8zm0-18v6h8V3z"/></svg>
    </button>
    <button class="icon-btn" id="btn-settings" title="Pairing & settings" aria-label="Settings">
      <svg viewBox="0 0 24 24"><path d="M19.4 13a7.7 7.7 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 0 0-1.7-1L15 3h-4l-.3 2.9a7.6 7.6 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.7 7.7 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.6 7.6 0 0 0 1.7 1L11 21h4l.3-2.9a7.6 7.6 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7" transform="translate(-1 0)"/></svg>
    </button>
  </header>
  <main id="app"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
